project_id = "pg-cron-queue-workflow"

[db]
port = 54322
shadow_port = 54320
major_version = 17

[api]
enabled = true
port = 54321
# pgmq_public is exposed so the edge function can drain the queue over the Data
# API (supabase-js .schema('pgmq_public').rpc(...)), matching the Queues guide.
schemas = ["public", "graphql_public", "pgmq_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[auth]
enabled = true
site_url = "http://127.0.0.1:3000"
jwt_expiry = 3600
enable_signup = true

[auth.email]
enable_signup = true
enable_confirmations = false

[edge_runtime]
enabled = true
