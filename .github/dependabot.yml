version: 2
updates:
  # Bumps the `submodules/agent-skills` pin so evals don't run on outdated skills.
  # For `gitsubmodule`, `directory` is where .gitmodules lives.
  - package-ecosystem: "gitsubmodule"
    directory: "/"
    schedule:
      interval: "daily"
    commit-message:
      prefix: "chore(deps)"
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "cron"
      cronjob: "0 * * * *"
    allow:
      - dependency-name: "@supabase/mcp-server-supabase"
    cooldown:
      exclude:
        - "@supabase/mcp-server-supabase"
    commit-message:
      prefix: "chore(deps)"
