version: 2
updates:
  # Keeps the `submodules/agent-skills` pin (see .gitmodules) on the latest
  # supabase/agent-skills commit so evals don't run against outdated skills.
  # For `gitsubmodule`, `directory` is where .gitmodules lives (the repo root);
  # Dependabot opens one PR per submodule that has a newer commit.
  - package-ecosystem: "gitsubmodule"
    directory: "/"
    schedule:
      interval: "daily"
    commit-message:
      prefix: "chore(deps)"
