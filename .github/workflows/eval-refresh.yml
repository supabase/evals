name: Refresh eval results

on:
  workflow_dispatch:
    inputs:
      warp_probe:
        description: "Probe WARP service-token enrollment"
        type: boolean
        required: false
        default: false
      experiments:
        description: "Comma-separated experiment names to run within each selected eval suite"
        required: false
        default: ""
      eval:
        description: "Comma-separated eval ids to run (overrides suite)"
        required: false
        default: ""
      suite:
        description: "Comma-separated suites to run (evals/<suite> with experiments/<suite>)"
        required: false
        default: ""
      runs:
        description: "Independent scored runs per experiment/eval pair"
        required: true
        default: "3"
      timeout_sec:
        description: "Timeout per run in seconds"
        required: true
        default: "720"
      sandbox_concurrency:
        description: "Maximum Vercel Sandboxes running at once"
        required: true
        default: "250"
      merge:
        description: "Merge into existing results instead of overwriting (graft new experiment/eval pairs)"
        type: boolean
        required: false
        default: true
      commit_to_branch:
        description: "Commit exported results to the dispatched branch instead of opening a PR"
        type: boolean
        required: false
        default: false
      cli_stable_version:
        description: "Pin the cli suite's stable CLI version instead of resolving npm's latest dist-tag (blank to resolve)"
        required: false
        default: ""
      cli_beta_version:
        description: "Pin the cli suite's beta CLI version instead of resolving npm's beta dist-tag (blank to resolve)"
        required: false
        default: ""
      cli_next_version:
        description: "Pin the cli suite's next CLI version instead of resolving npm's next dist-tag (blank to resolve)"
        required: false
        default: ""
  schedule:
    - cron: '15 6 * * *'
  pull_request:
    # Run whenever a PR carrying the run-evals label is opened, pushed to, or
    # receives the run-evals label. The job-level `if` gates on those cases.
    types: [opened, synchronize, labeled]

permissions:
  contents: write
  pull-requests: write
  actions: read

concurrency:
  # The results app's pushes get a unique group so they can't cancel the run that pushed them.
  group: eval-refresh-${{ github.event.sender.id == 291952723 && github.run_id || github.event_name == 'pull_request' && github.event.pull_request.number || github.ref }}
  # Supersede an in-flight run when a new commit is pushed to the same PR, but
  # never cancel a workflow_dispatch run (those open the refresh PR).
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  warp-enrollment-probe:
    if: github.event_name == 'workflow_dispatch' && inputs.warp_probe
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - name: Connect WARP
        env:
          WARP_CLIENT_ID: ${{ secrets.CLOUDFLARE_WARP_CLIENT_ID }}
          WARP_CLIENT_SECRET: ${{ secrets.CLOUDFLARE_WARP_CLIENT_SECRET }}
        shell: bash
        run: |
          set -euo pipefail
          set +x
          test -n "$WARP_CLIENT_ID" && test -n "$WARP_CLIENT_SECRET"
          sudo install -d -m 700 /var/lib/cloudflare-warp
          python3 -c 'import os, xml.etree.ElementTree as E; d=E.Element("dict"); [(E.SubElement(d,"key").__setattr__("text",k), E.SubElement(d,"string").__setattr__("text",v)) for k,v in [("organization","supabase"),("auth_client_id",os.environ["WARP_CLIENT_ID"]),("auth_client_secret",os.environ["WARP_CLIENT_SECRET"])]]; print(E.tostring(d, encoding="unicode"))' | sudo sh -c 'umask 077; cat > /var/lib/cloudflare-warp/mdm.xml'
          curl -fsSL https://pkg.cloudflareclient.com/pubkey.gpg | sudo gpg --dearmor -o /usr/share/keyrings/cloudflare-warp-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/cloudflare-warp-archive-keyring.gpg] https://pkg.cloudflareclient.com/ $(lsb_release -cs) main" | sudo tee /etc/apt/sources.list.d/cloudflare-client.list
          sudo apt-get update -qq
          sudo apt-get install -y cloudflare-warp
          for attempt in {1..10}; do
            if warp-cli --accept-tos registration show >/dev/null 2>&1; then break; fi
            if [ "$attempt" -eq 10 ]; then echo 'WARP registration failed'; exit 1; fi
            sleep "$((attempt * 2))"
          done
          warp-cli --accept-tos connect
          for attempt in {1..10}; do
            if warp-cli --accept-tos status | grep -q 'Connected'; then echo 'WARP connected'; break; fi
            if [ "$attempt" -eq 10 ]; then echo 'WARP connection failed'; exit 1; fi
            sleep "$((attempt * 2))"
          done
      - name: Check Spark API
        env:
          SPARK_API_URL: ${{ secrets.SPARK_API_URL }}
        shell: bash
        run: |
          set -euo pipefail
          python3 -c '
          import fnmatch, ipaddress, os, socket, subprocess, urllib.parse
          host = urllib.parse.urlsplit(os.environ["SPARK_API_URL"]).hostname
          settings = subprocess.run(["warp-cli", "--accept-tos", "settings"], capture_output=True, text=True, check=True).stdout
          lines = settings.splitlines()
          print("WARP mode:", next((line.split("Mode:", 1)[1].strip() for line in lines if "\tMode:" in line), "unknown"))
          print("WARP profile:", next((line.split("Profile ID:", 1)[1].strip() for line in lines if "\tProfile ID:" in line), "unknown"))
          rules = [line.strip().split(" ", 1)[0] for line in lines if line.strip().startswith("*.")]
          print("Spark host matches a WARP domain rule:", bool(host and any(fnmatch.fnmatch(host, rule) for rule in rules)))
          try:
              addresses = socket.getaddrinfo(host, 443, type=socket.SOCK_STREAM)
              print("Spark DNS resolution: succeeded")
              print("Spark resolved address classes:", ",".join(sorted({"private" if ipaddress.ip_address(a[4][0]).is_private else "public" for a in addresses})))
          except socket.gaierror as error:
              print("Spark DNS resolution failed; code:", error.errno)
          '
          set +e
          status=$(curl --silent --output /dev/null --write-out '%{http_code}' --connect-timeout 10 --max-time 30 "${SPARK_API_URL%/}/v1/projects" 2>/dev/null)
          curl_exit=$?
          set -e
          echo "Spark curl exit code: $curl_exit"
          if [ "$curl_exit" -ne 0 ]; then exit 1; fi
          echo "Spark API HTTP status: $status"
          case "$status" in
            200|405) ;;
            *) exit 1 ;;
          esac
      - name: Disconnect and deregister WARP
        if: always()
        shell: bash
        run: |
          sudo rm -f /var/lib/cloudflare-warp/mdm.xml
          if command -v warp-cli >/dev/null; then
            warp-cli --accept-tos disconnect || true
            warp-cli --accept-tos registration delete || true
            for attempt in {1..10}; do
              if ! warp-cli --accept-tos registration show >/dev/null 2>&1; then echo 'WARP deregistered'; break; fi
              if [ "$attempt" -eq 10 ]; then echo 'WARP is still registered'; exit 1; fi
              sleep "$((attempt * 2))"
            done
          fi

  prepare:
    # 291952723 is supabase-evals-releaser[bot], which pushes the results commit.
    if: >-
      (github.event_name == 'workflow_dispatch' && !inputs.warp_probe) ||
      github.event_name == 'schedule' ||
      (github.event_name == 'pull_request' &&
        github.event.sender.id != 291952723 &&
        (contains(github.event.pull_request.labels.*.name, 'run-evals') ||
         contains(github.event.pull_request.labels.*.name, 'run-evals-changed')) &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        (github.event.action != 'labeled' ||
         github.event.label.name == 'run-evals' ||
         github.event.label.name == 'run-evals-changed'))
    runs-on: ubuntu-26.04
    outputs:
      pairs: ${{ steps.discover.outputs.pairs }}
      runs: ${{ steps.inputs.outputs.runs }}
      timeout_sec: ${{ steps.inputs.outputs.timeout_sec }}
      sandbox_concurrency: ${{ steps.inputs.outputs.sandbox_concurrency }}
      filter_changed: ${{ steps.inputs.outputs.filter_changed }}
      do_merge: ${{ steps.inputs.outputs.do_merge }}
      cli_stable_version: ${{ steps.inputs.outputs.cli_stable_version }}
      cli_beta_version: ${{ steps.inputs.outputs.cli_beta_version }}
      cli_next_version: ${{ steps.inputs.outputs.cli_next_version }}
    steps:
      - name: Prepare inputs
        id: inputs
        shell: bash
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            experiments_override="${{ inputs.experiments }}"
            eval_id="${{ inputs.eval }}"
            suite="${{ inputs.suite }}"
            runs="${{ inputs.runs }}"
            timeout_sec="${{ inputs.timeout_sec }}"
            sandbox_concurrency="${{ inputs.sandbox_concurrency }}"
            cli_stable_version="${{ inputs.cli_stable_version }}"
            cli_beta_version="${{ inputs.cli_beta_version }}"
            cli_next_version="${{ inputs.cli_next_version }}"

            if [ -z "$suite" ] && [ -z "$eval_id" ]; then
              echo "::error::Set suite or eval to choose which evals to run."
              exit 1
            fi
          elif [ "${{ github.event_name }}" = "schedule" ]; then
            experiments_override=""
            eval_id=""
            suite="regression,cli"
            runs="3"
            timeout_sec="720"
            sandbox_concurrency="250"
            cli_stable_version=""
            cli_beta_version=""
            cli_next_version=""
          else
            experiments_override=""
            eval_id=""
            suite="benchmark,regression,docs,cli"
            runs="3"
            timeout_sec="720"
            sandbox_concurrency="250"
            cli_stable_version=""
            cli_beta_version=""
            cli_next_version=""
          fi

          suite_json="$(jq -Rc 'split(",") | map(gsub("^\\s+|\\s+$"; "")) | map(select(length > 0))' <<< "$suite")"

          # run-evals takes priority; run-evals-changed only filters when run-evals is absent.
          # filter_changed drives the changed-eval filter (PR-only, needs a PR diff).
          filter_changed="false"
          if [ "${{ github.event_name }}" = "pull_request" ] && \
             [ "${{ contains(github.event.pull_request.labels.*.name, 'run-evals-changed') }}" = "true" ] && \
             [ "${{ contains(github.event.pull_request.labels.*.name, 'run-evals') }}" = "false" ]; then
            filter_changed="true"
          fi

          # do_merge drives the export --merge (graft into existing results). It's
          # always on for the changed path, and opt-in for manual dispatch.
          do_merge="$filter_changed"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.merge }}" = "true" ]; then
            do_merge="true"
          fi

          {
            echo "experiments_override=$experiments_override"
            echo "eval=$eval_id"
            echo "suite=$suite_json"
            echo "runs=$runs"
            echo "timeout_sec=$timeout_sec"
            echo "sandbox_concurrency=$sandbox_concurrency"
            echo "filter_changed=$filter_changed"
            echo "do_merge=$do_merge"
            echo "cli_stable_version=$cli_stable_version"
            echo "cli_beta_version=$cli_beta_version"
            echo "cli_next_version=$cli_next_version"
          } >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3
        with:
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref }}

      - name: Install pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Discover eval pairs
        id: discover
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          touch .env
          suite_json='${{ steps.inputs.outputs.suite }}'
          eval_ids="${{ steps.inputs.outputs.eval }}"
          if [ -n "$eval_ids" ]; then
            matching=()
            while IFS= read -r id; do
              compgen -G "evals/*/$id" > /dev/null && matching+=("$id")
            done < <(jq -Rr 'split(",") | map(gsub("^\\s+|\\s+$"; "")) | .[]' <<< "$eval_ids")
          else
            matching=()
            for dir in evals/*/*/; do
              [ -d "$dir" ] || continue
              id=$(basename "$dir")
              [ -f "$dir/PROMPT.md" ] || continue
              suite_val=$(basename "$(dirname "$dir")")
              if jq -e --arg s "$suite_val" 'index($s) != null' <<< "$suite_json" > /dev/null 2>&1; then
                matching+=("$id")
              fi
            done
          fi

          if [ "${{ steps.inputs.outputs.filter_changed }}" = "true" ]; then
            changed_evals=$(gh pr diff ${{ github.event.pull_request.number }} --name-only \
              | grep '^evals/' | cut -d/ -f3 | sort -u || true)

            if [ -z "$changed_evals" ]; then
              echo "No eval directories changed in this PR — nothing to run"
              echo "pairs=[]" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            echo "Changed eval dirs: $changed_evals"
            filtered=()
            for id in "${matching[@]}"; do
              if echo "$changed_evals" | grep -qx "$id"; then
                filtered+=("$id")
              fi
            done
            matching=("${filtered[@]+"${filtered[@]}"}")
          fi

          if [ "${#matching[@]}" -eq 0 ]; then
            echo "Changed evals don't match requested suites: $suite_json"
            echo "pairs=[]" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          pairs='[]'
          experiments_override="$(jq -Rc 'split(",") | map(gsub("^\\s+|\\s+$"; "")) | map(select(length > 0))' <<< "${{ steps.inputs.outputs.experiments_override }}")"
          checked_suites=" "
          for id in "${matching[@]}"; do
            eval_suite=$(basename "$(dirname "$(compgen -G "evals/*/$id")")")
            if [ "$experiments_override" != "[]" ] && [[ "$checked_suites" != *" $eval_suite "* ]]; then
              available="$(pnpm --silent eval -- list --suite "$eval_suite" | jq -c 'map(split("/")[1])')"
              missing="$(jq -r --argjson available "$available" '. - $available | join(",")' <<< "$experiments_override")"
              if [ -n "$missing" ]; then
                echo "Experiments not found in $eval_suite: $missing" >&2
                exit 1
              fi
              checked_suites+="$eval_suite "
            fi
            experiments_json="$(pnpm --silent eval -- list --suite "$eval_suite" --eval "$id" | jq -c --argjson want "$experiments_override" 'map(split("/")[1]) | if $want == [] then . else map(select(IN($want[]))) end')"
            while IFS= read -r experiment; do
              pairs="$(jq -c \
                --arg eval_id "$id" \
                --arg experiment "$experiment" \
                --arg eval_suite "$eval_suite" \
                '. + [{eval_id: $eval_id, experiment: $experiment, eval_suite: $eval_suite}]' \
                <<< "$pairs")"
            done < <(jq -r '.[]' <<< "$experiments_json")
          done

          if [ "$experiments_override" != "[]" ]; then
            for suite in $checked_suites; do
              matched="$(jq -c --arg suite "$suite" '[.[] | select(.eval_suite == $suite) | .experiment] | unique' <<< "$pairs")"
              unmatched="$(jq -r --argjson matched "$matched" '. - $matched | join(",")' <<< "$experiments_override")"
              if [ -n "$unmatched" ]; then
                echo "Experiments that match no selected evals in $suite: $unmatched" >&2
                exit 1
              fi
            done
          fi

          if [ "$(jq 'length' <<< "$pairs")" -eq 0 ]; then
            echo "No experiment and eval pairs matched" >&2
            exit 1
          fi

          echo "pairs=$pairs" >> "$GITHUB_OUTPUT"

  run-evals:
    needs: prepare
    if: needs.prepare.outputs.pairs != '[]'
    runs-on: ubuntu-26.04
    # 60 min gives ~2x margin over the slowest observed run:
    # https://github.com/supabase/evals/actions/runs/31802584549
    timeout-minutes: 60
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      AI_GATEWAY_API_KEY: ${{ secrets.AI_GATEWAY_API_KEY }}
      XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_TEAM_ID: ${{ secrets.VERCEL_TEAM_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      SPARK_API_URL: ${{ secrets.SPARK_API_URL }}
      SUPABASE_CLI_STABLE_VERSION: ${{ needs.prepare.outputs.cli_stable_version }}
      SUPABASE_CLI_BETA_VERSION: ${{ needs.prepare.outputs.cli_beta_version }}
      SUPABASE_CLI_NEXT_VERSION: ${{ needs.prepare.outputs.cli_next_version }}
    steps:
      - name: Checkout
        uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3
        with:
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref }}

      - name: Install pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Write eval environment
        shell: bash
        run: |
          set -euo pipefail

          {
            echo "ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}"
            echo "OPENAI_API_KEY=${OPENAI_API_KEY}"
            echo "AI_GATEWAY_API_KEY=${AI_GATEWAY_API_KEY}"
            echo "XAI_API_KEY=${XAI_API_KEY}"
            echo "SPARK_API_URL=${SPARK_API_URL}"
            echo "SUPABASE_CLI_STABLE_VERSION=${SUPABASE_CLI_STABLE_VERSION}"
            echo "SUPABASE_CLI_BETA_VERSION=${SUPABASE_CLI_BETA_VERSION}"
            echo "SUPABASE_CLI_NEXT_VERSION=${SUPABASE_CLI_NEXT_VERSION}"
          } > .env

      - name: Run evals
        env:
          EVAL_PAIRS: ${{ needs.prepare.outputs.pairs }}
          EVAL_REVISION: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        shell: bash
        run: |
          set -euo pipefail

          pnpm --filter @supabase-evals/framework eval:vercel -- \
            --pairs-json "$EVAL_PAIRS" \
            --revision "$EVAL_REVISION" \
            --runs "${{ needs.prepare.outputs.runs }}" \
            --timeout-sec "${{ needs.prepare.outputs.timeout_sec }}" \
            --concurrency "${{ needs.prepare.outputs.sandbox_concurrency }}"

      - name: Upload raw results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: raw-results
          path: results/downloaded/
          overwrite: true
          if-no-files-found: warn
          retention-days: 3

  publish-results:
    needs: [prepare, run-evals]
    # Runs even after run-evals times out or partially fails, since results
    # are written per pair and export-results skips any pair that never finished.
    if: "always() && needs.run-evals.result != 'skipped' && needs.prepare.outputs.pairs != '[]'"
    runs-on: ubuntu-26.04
    steps:
      - name: Generate GitHub App token
        id: generate-token
        # The App token lets the pushes below trigger gh-pages and PR checks.
        # https://docs.github.com/en/actions/how-tos/write-workflows/choose-when-workflows-run/trigger-a-workflow#triggering-a-workflow-from-a-workflow
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.GH_APP_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}

      - name: Checkout
        uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3
        with:
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref }}
          token: ${{ steps.generate-token.outputs.token }}

      - name: Install pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download raw results
        # If every pair failed, run-evals never uploads a raw-results artifact
        # at all, so this action errors. Audit pair results below already
        # handles a missing/empty results/downloaded correctly (every pair
        # reports missing), so don't let a total failure hide behind this.
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: raw-results
          path: results/downloaded

      - name: Extract raw workspaces
        # Workspaces arrive tarred so upload-artifact never sees agent-written filenames.
        shell: bash
        run: |
          set -euo pipefail

          if [ -d results/downloaded ]; then
            find results/downloaded -name 'workspace.tgz' -print0 | while IFS= read -r -d '' archive; do
              workspace="$(dirname "$archive")/workspace"
              mkdir -p "$workspace"
              tar -xzf "$archive" -C "$workspace"
              rm "$archive"
            done
          fi

      - name: Audit pair results
        id: audit
        shell: bash
        run: |
          set -euo pipefail

          pairs='${{ needs.prepare.outputs.pairs }}'
          total="$(jq 'length' <<< "$pairs")"
          # A pair needs every requested run, not just a directory, since a
          # partial pair would otherwise skew the average against its neighbours.
          expected="${{ needs.prepare.outputs.runs }}"
          required="$(jq -cn --argjson expected "$expected" '[range(1; $expected + 1)]')"
          missing=()
          while IFS= read -r key; do
            dir="results/downloaded/raw-results-$key"
            actual='[]'
            if [ -d "$dir" ]; then
              actual="$(find "$dir" -mindepth 3 -maxdepth 3 -path '*/run-*/result.json' -print \
                | jq -Rsc '[splits("\n") | select(length > 0) | capture("/run-(?<run>[0-9]+)/result.json$").run | tonumber] | sort')"
            fi
            found="$(jq 'length' <<< "$actual")"
            [ "$actual" = "$required" ] || missing+=("$key ($found/$expected runs)")
          done < <(jq -r '.[] | "\(.eval_suite)__\(.experiment)__\(.eval_id)"' <<< "$pairs")

          echo "count=${#missing[@]}" >> "$GITHUB_OUTPUT"

          if [ "${#missing[@]}" -eq "$total" ]; then
            echo "::warning::No results published: all $total eval pairs are missing runs (run-evals likely hit its timeout or failed partway). This run needs a follow-up to complete the refresh."
            {
              echo "## :warning: No results published"
              echo ""
              echo "All $total eval pairs never finished, likely because \`run-evals\` hit its timeout or failed partway through:"
              echo ""
              echo '```'
              printf '%s\n' "${missing[@]}"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          elif [ "${#missing[@]}" -gt 0 ]; then
            echo "::warning::Publishing PARTIAL results: ${#missing[@]} of $total eval pairs are missing runs (run-evals likely hit its timeout or failed partway). This run needs a follow-up to complete the refresh."
            {
              echo "## :warning: Partial results published"
              echo ""
              echo "${#missing[@]} of $total eval pairs are missing runs, likely because \`run-evals\` hit its timeout or failed partway through. Only the pairs with a complete set of runs were published; these were not:"
              echo ""
              echo '```'
              printf '%s\n' "${missing[@]}"
              echo '```'
              echo ""
              echo "Re-run this workflow to fill in the missing pairs."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Export results
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p results
          pairs='${{ needs.prepare.outputs.pairs }}'
          while IFS= read -r ref; do
            folder="${ref%%/*}"
            experiment="${ref#*/}"
            mkdir -p "results/$folder/$experiment"
            for artifact_dir in "results/downloaded/raw-results-${folder}__${experiment}__"*/; do
              [ -d "$artifact_dir" ] && cp -R "$artifact_dir"/. "results/$folder/$experiment"/
            done
          done < <(jq -r '.[] | "\(.eval_suite)/\(.experiment)"' <<< "$pairs" | sort -u)

          if jq -e 'any(.[]; .eval_suite == "benchmark")' <<< "$pairs" > /dev/null; then
            export_args=(--suite benchmark --runs "${{ needs.prepare.outputs.runs }}" --output apps/web/src/data/eval-results.json)
            if [ "${{ needs.prepare.outputs.do_merge }}" = "true" ]; then
              export_args+=(--merge)
            fi
            pnpm --filter @supabase-evals/framework export-results -- "${export_args[@]}"
          fi

          for eval_suite in regression docs cli; do
            if jq -e --arg s "$eval_suite" 'any(.[]; .eval_suite == $s)' <<< "$pairs" > /dev/null; then
              export_args=(--suite "$eval_suite" --runs "${{ needs.prepare.outputs.runs }}" --output "apps/web/src/data/${eval_suite}-eval-results.json")
              if [ "${{ needs.prepare.outputs.do_merge }}" = "true" ]; then
                export_args+=(--merge)
              fi
              pnpm --filter @supabase-evals/framework export-results -- "${export_args[@]}"
            fi
          done

      - name: Find the PRs for this branch
        if: github.event_name == 'workflow_dispatch'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          urls=$(gh pr list --head "$GITHUB_REF_NAME" --state open --json url,isCrossRepository --jq '.[] | select(.isCrossRepository == false) | .url' | paste -sd ' ' -)
          echo "PR_URLS=$urls" >> "$GITHUB_ENV"

      - name: Upload results to Braintrust
        # A Braintrust outage shouldn't block publishing results.
        continue-on-error: true
        env:
          BRAINTRUST_API_KEY: ${{ secrets.BRAINTRUST_API_KEY }}
          BRAINTRUST_PROJECT_ID: ${{ secrets.BRAINTRUST_PROJECT_ID }}
        run: pnpm upload-braintrust --runs "${{ needs.prepare.outputs.runs }}"

      - name: Upload exported results
        if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: eval-results-json
          path: apps/web/src/data/*eval-results.json
          if-no-files-found: error
          retention-days: 7

      - name: Commit exported results to branch
        # PR runs commit to the PR head branch. Manual dispatch commits to the
        # selected branch only when commit_to_branch is enabled. Scheduled runs
        # go through a PR instead (see "Create results pull request" below):
        # main's branch protection rejects a direct push.
        if: >-
          github.event_name == 'pull_request' ||
          (github.event_name == 'workflow_dispatch' && inputs.commit_to_branch)
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          # github-actions[bot]'s noreply email uses its public user ID: https://github.com/actions/checkout#push-a-commit-using-the-built-in-token
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for result_file in apps/web/src/data/*eval-results.json; do
            [ -f "$result_file" ] && git add "$result_file"
          done

          if git diff --cached --quiet; then
            echo "No eval result changes to commit"
            exit 0
          fi

          # This push runs the PR checks. prepare skips it so the refresh doesn't loop.
          git commit -m "chore: refresh eval results"
          git push

      - name: Create results pull request
        if: >-
          github.event_name == 'schedule' ||
          (github.event_name == 'workflow_dispatch' && !inputs.commit_to_branch)
        id: cpr
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ steps.generate-token.outputs.token }}
          add-paths: apps/web/src/data/*eval-results.json
          # The action resets an existing branch, so reusing a name replaces the earlier run's results.
          # Manual dispatches get a branch per run to keep them apart. Scheduled runs share one branch.
          # https://github.com/peter-evans/create-pull-request/blob/5f6978faf089d4d20b00c7766989d076bb2fc7f1/src/create-or-update-branch.ts#L297-L310
          branch: chore/refresh-eval-results-${{ github.ref_name }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.event_name }}
          base: ${{ github.ref_name }}
          commit-message: "chore: refresh eval results"
          title: "chore: refresh eval results"
          body: |
            Refreshes `apps/web/src/data/eval-results.json` from the latest automated eval run.
          # Draft PRs can't be merged, and the scheduled path merges itself.
          draft: ${{ github.event_name != 'schedule' }}
          delete-branch: true

      - name: Merge scheduled results pull request
        # --admin merges without the required review, which the bypass list
        # entitles the app to.
        # https://cli.github.com/manual/gh_pr_merge
        # Skips the merge when results are partial, so it stays open for review.
        if: >-
          github.event_name == 'schedule' &&
          steps.cpr.outputs.pull-request-number &&
          steps.audit.outputs.count == '0'
        env:
          GH_TOKEN: ${{ steps.generate-token.outputs.token }}
        run: gh pr merge "${{ steps.cpr.outputs.pull-request-number }}" --squash --delete-branch --admin

      - name: Require complete results
        # Runs last so partial results still publish, but the job still fails.
        if: >-
          always() &&
          steps.audit.outcome == 'success' &&
          steps.audit.outputs.count != '0'
        run: |
          echo "::error::${{ steps.audit.outputs.count }} eval pair(s) are missing runs. This run needs a follow-up to complete the refresh."
          exit 1
