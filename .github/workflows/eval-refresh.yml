name: Refresh eval results

on:
  workflow_dispatch:
    inputs:
      experiments:
        description: "Comma-separated experiment names to run"
        required: true
        default: "openai-gpt-5.4-mini,openai-gpt-5.4-nano"
      eval:
        description: "Optional comma-separated eval ids to run"
        required: false
        default: ""
      suite:
        description: "Comma-separated eval suites to run"
        required: true
        default: "benchmark"
      runs:
        description: "Attempts per experiment/eval pair"
        required: true
        default: "1"
      timeout_sec:
        description: "Timeout per attempt in seconds"
        required: true
        default: "720"
  pull_request:
    # Run whenever a PR carrying a refresh label is opened, pushed to, or
    # receives that label. The job-level `if` gates on those cases.
    types: [opened, synchronize, labeled]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: eval-refresh-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.ref }}
  # Supersede an in-flight run when a new commit is pushed to the same PR, but
  # never cancel a workflow_dispatch run (those open the refresh PR).
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  prepare:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
        (contains(github.event.pull_request.labels.*.name, 'run-evals') ||
          contains(github.event.pull_request.labels.*.name, 'run-changed-evals')) &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        (github.event.action != 'labeled' ||
          github.event.label.name == 'run-evals' ||
          github.event.label.name == 'run-changed-evals'))
    runs-on: ubuntu-latest
    outputs:
      experiments: ${{ steps.inputs.outputs.experiments }}
      evals: ${{ steps.inputs.outputs.evals }}
      suite: ${{ steps.inputs.outputs.suite }}
      runs: ${{ steps.inputs.outputs.runs }}
      timeout_sec: ${{ steps.inputs.outputs.timeout_sec }}
      merge_results: ${{ steps.inputs.outputs.merge_results }}
      should_run: ${{ steps.inputs.outputs.should_run }}
    steps:
      - name: Checkout
        if: github.event_name == 'pull_request'
        uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref }}

      - name: Prepare inputs
        id: inputs
        shell: bash
        run: |
          set -euo pipefail

          merge_results="false"
          should_run="true"

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            experiments="${{ inputs.experiments }}"
            eval_id="${{ inputs.eval }}"
            suite="${{ inputs.suite }}"
            runs="${{ inputs.runs }}"
            timeout_sec="${{ inputs.timeout_sec }}"
            evals_json="$(jq -Rc 'split(",") | map(gsub("^\\s+|\\s+$"; "")) | map(select(length > 0))' <<< "$eval_id")"
          else
            experiments="openai-gpt-5.4-mini,openai-gpt-5.4-nano"
            suite="benchmark"
            runs="1"
            timeout_sec="720"

            if [ "${{ contains(github.event.pull_request.labels.*.name, 'run-changed-evals') }}" = "true" ] &&
              [ "${{ contains(github.event.pull_request.labels.*.name, 'run-evals') }}" != "true" ]; then
              merge_results="true"
              changed_eval_ids="$(git diff --name-only "${{ github.event.pull_request.base.sha }}" HEAD |
                awk -F/ '$1 == "evals" && NF >= 3 { print $2 }' |
                sort -u)"
              evals_json="$(jq -Rnc '[inputs | select(length > 0)]' <<< "$changed_eval_ids")"
              if [ "$evals_json" = "[]" ]; then
                should_run="false"
              fi
            else
              evals_json="[]"
            fi
          fi

          experiments_json="$(jq -Rc 'split(",") | map(gsub("^\\s+|\\s+$"; "")) | map(select(length > 0))' <<< "$experiments")"
          suite_json="$(jq -Rc 'split(",") | map(gsub("^\\s+|\\s+$"; "")) | map(select(length > 0))' <<< "$suite")"

          {
            echo "experiments=$experiments_json"
            echo "evals=$evals_json"
            echo "suite=$suite_json"
            echo "runs=$runs"
            echo "timeout_sec=$timeout_sec"
            echo "merge_results=$merge_results"
            echo "should_run=$should_run"
          } >> "$GITHUB_OUTPUT"

  run-evals:
    needs: prepare
    if: needs.prepare.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        experiment: ${{ fromJSON(needs.prepare.outputs.experiments) }}
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3
        with:
          submodules: recursive
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Write eval environment
        shell: bash
        run: |
          set -euo pipefail

          {
            echo "ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}"
            echo "OPENAI_API_KEY=${OPENAI_API_KEY}"
          } > .env

      - name: Run evals
        shell: bash
        run: |
          set -euo pipefail

          args=(
            "--experiment"
            "${{ matrix.experiment }}"
            "--runs"
            "${{ needs.prepare.outputs.runs }}"
            "--timeout-sec"
            "${{ needs.prepare.outputs.timeout_sec }}"
            "--force"
          )

          while IFS= read -r suite; do
            args+=("--suite" "$suite")
          done < <(jq -r '.[]' <<< '${{ needs.prepare.outputs.suite }}')

          while IFS= read -r eval_id; do
            args+=("--eval" "$eval_id")
          done < <(jq -r '.[]' <<< '${{ needs.prepare.outputs.evals }}')

          npm run eval -- "${args[@]}"

      - name: Upload raw results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: raw-results-${{ matrix.experiment }}
          path: results/${{ matrix.experiment }}/
          retention-days: 3

  publish-results:
    needs: [prepare, run-evals]
    if: needs.prepare.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3
        with:
          submodules: recursive
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download raw results
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: downloaded-results

      - name: Export web results
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p results
          export_args=()
          while IFS= read -r experiment; do
            artifact_dir="downloaded-results/raw-results-$experiment"
            if [ -d "$artifact_dir" ]; then
              mkdir -p "results/$experiment"
              cp -R "$artifact_dir"/. "results/$experiment"/
            fi
            export_args+=("--experiment" "$experiment")
          done < <(jq -r '.[]' <<< '${{ needs.prepare.outputs.experiments }}')

          while IFS= read -r suite; do
            export_args+=("--suite" "$suite")
          done < <(jq -r '.[]' <<< '${{ needs.prepare.outputs.suite }}')

          while IFS= read -r eval_id; do
            export_args+=("--eval" "$eval_id")
          done < <(jq -r '.[]' <<< '${{ needs.prepare.outputs.evals }}')

          if [ "${{ needs.prepare.outputs.merge_results }}" = "true" ]; then
            export_args+=("--merge")
          fi

          npm run -w @supabase-evals/framework export-results -- "${export_args[@]}"

      - name: Upload exported results
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: eval-results-json
          path: apps/web/src/data/eval-results.json
          retention-days: 7

      - name: Commit exported results to PR
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          # github-actions[bot]'s noreply email uses its public user ID: https://github.com/actions/checkout#push-a-commit-using-the-built-in-token
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add apps/web/src/data/eval-results.json

          if git diff --cached --quiet; then
            echo "No eval result changes to commit"
            exit 0
          fi

          git commit -m "chore: refresh eval results"
          git push

      - name: Generate GitHub App token
        id: generate-token
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.GH_APP_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}

      - name: Create results pull request
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ steps.generate-token.outputs.token }}
          add-paths: apps/web/src/data/eval-results.json
          branch: chore/refresh-eval-results
          commit-message: "chore: refresh eval results"
          title: "chore: refresh eval results"
          body: |
            Refreshes `apps/web/src/data/eval-results.json` from the latest automated eval run.
          draft: true
          delete-branch: true
