    <script>
      // Apply the stored theme before the prerendered markup paints, otherwise a
      // dark-mode visitor sees a light flash until the ThemeProvider effect runs.
      // Keep the storage key and class names in sync with
      // src/components/theme-provider.tsx.
      ;(function () {
        try {
          var stored = localStorage.getItem("theme")
          var resolved =
            stored === "dark" || stored === "light"
              ? stored
              : window.matchMedia("(prefers-color-scheme: dark)").matches
                ? "dark"
                : "light"
          var root = document.documentElement
          root.classList.remove("light", "dark")
          root.classList.add(resolved)
        } catch {
          // Storage or matchMedia unavailable: leave the default styling alone.
        }
      })()
    </script>

    <div id="root"></div>
