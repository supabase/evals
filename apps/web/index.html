<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--
      Favicon ladder. favicon.ico only contains a single 16x16 layer, so on its
      own it gets upscaled (and looks blurry) on HiDPI/retina displays, where a
      16px tab slot needs 32 physical pixels. Advertising the PNG sizes lets the
      browser pick an exact match instead. Keep favicon.ico last and without
      sizes="any" - that attribute claims the resource is scalable to any size,
      which would make it win over the PNGs again.
    -->
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon/favicon-16x16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon/favicon-48x48.png" />
    <link rel="icon" type="image/png" sizes="96x96" href="/favicon/favicon-96x96.png" />
    <link rel="icon" type="image/png" sizes="128x128" href="/favicon/favicon-128.png" />
    <link rel="icon" type="image/png" sizes="196x196" href="/favicon/favicon-196x196.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/favicon/favicon-180x180.png" />
    <link rel="icon" href="/favicon/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Supabase Evals</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
